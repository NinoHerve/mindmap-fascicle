[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI ("fascicle" is taken by an unrelated project);
# the import name stays `fascicle`.
name = "mindmap-fascicle"
version = "0.3.0"
description = "Read and write BIDS neuroimaging datasets, with extensions for FreeSurfer, SimNIBS charm and MNE-Python derivatives."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Herve Nino", email = "herve.nino@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["BIDS", "neuroimaging", "MRI", "FreeSurfer", "MNE", "SimNIBS", "derivatives"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pybids",
    "pyyaml",
    "numpy",
    "nibabel",
    "pandas>=2.0",
]

[project.optional-dependencies]
mne = ["mne"]
all = ["mindmap-fascicle[mne]"]
test = ["pytest"]
examples = ["openneuro-py", "matplotlib", "jupyter", "antspyx"]

[project.urls]
Homepage = "https://github.com/NinoHerve/mindmap-fascicle"
Repository = "https://github.com/NinoHerve/mindmap-fascicle"
Issues = "https://github.com/NinoHerve/mindmap-fascicle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fascicle"]

[tool.hatch.build.targets.sdist]
# The tutorial notebook embeds plot images (~0.5 MB); it stays on GitHub.
exclude = ["examples/", ".vscode/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disable the "dash" pytest plugin some environments have autoloaded from
# user site-packages (dash.testing.plugin) — it fails to import when
# `blinker` isn't installed and has nothing to do with this project.
addopts = "-p no:dash"
